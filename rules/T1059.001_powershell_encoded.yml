id: win_powershell_encoded
title: PowerShell Encoded Command
level: high
description: Detects PowerShell launched with an encoded/base64 command, commonly used to hide payloads.
logsource:
  category: process_creation
  product: windows
attack:
  tactic: Execution
  technique_id: T1059.001
  technique: PowerShell
detection:
  selection:
    EventID: 1
    Image|endswith: \powershell.exe
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
      - FromBase64String
  condition: selection
